<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sally Coach - Realtime Console</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --accent: #3fb950;
    --muted: #8b949e;
    --danger: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--danger);
    transition: background 0.2s;
  }
  .dot.connected { background: var(--accent); }
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .controls label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  button {
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #30363d; }
  button:active { background: #3a4048; }
  #clearBtn:hover { border-color: var(--danger); color: var(--danger); }
  .count {
    font-size: 13px;
    color: var(--muted);
  }
  #console {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line {
    padding: 4px 0;
    border-bottom: 1px solid #1c2128;
  }
  .ts {
    color: var(--accent);
    font-weight: 600;
    margin-right: 6px;
  }
  .sep {
    color: var(--muted);
    margin-right: 6px;
  }
  .data {
    color: var(--text);
  }
  .empty {
    color: var(--muted);
    font-style: italic;
    padding: 20px 0;
  }
  #console::-webkit-scrollbar { width: 10px; }
  #console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
</style>
</head>
<body>

<header>
  <div class="title">
    <span class="dot" id="statusDot"></span>
    <span>Sally Coach — Realtime Console</span>
  </div>
  <div class="controls">
    <span class="count" id="lineCount">0 dòng</span>
    <label>
      <input type="checkbox" id="autoscroll" checked />
      Auto-scroll
    </label>
    <button id="clearBtn">🗑 Clear</button>
  </div>
</header>

<div id="console">
  <div class="empty">Đang chờ dữ liệu từ Sally Coach...</div>
</div>

<script>
  const consoleEl = document.getElementById('console');
  const statusDot = document.getElementById('statusDot');
  const autoscrollCb = document.getElementById('autoscroll');
  const clearBtn = document.getElementById('clearBtn');
  const lineCountEl = document.getElementById('lineCount');

  let lineCount = 0;

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderEntry(entry) {
    // Xoá trạng thái "empty" nếu có
    const emptyMsg = consoleEl.querySelector('.empty');
    if (emptyMsg) emptyMsg.remove();

    const line = document.createElement('div');
    line.className = 'line';
    line.innerHTML =
      '<span class="ts">' + escapeHtml(entry.timestamp) + '</span>' +
      '<span class="sep">:</span>' +
      '<span class="data">' + escapeHtml(entry.data) + '</span>';
    consoleEl.appendChild(line);

    lineCount++;
    lineCountEl.textContent = lineCount + ' dòng';

    if (autoscrollCb.checked) {
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }
  }

  function clearConsole() {
    consoleEl.innerHTML = '<div class="empty">Đang chờ dữ liệu từ Sally Coach...</div>';
    lineCount = 0;
    lineCountEl.textContent = '0 dòng';
  }

  // Nút Clear: xoá cả trên server để tất cả người xem cùng thấy console rỗng
  clearBtn.addEventListener('click', async () => {
    try {
      await fetch('/api/history', { method: 'DELETE' });
    } catch (e) {
      // nếu lỗi mạng, vẫn clear cục bộ
      clearConsole();
    }
  });

  // Load lịch sử khi mở trang
  async function loadHistory() {
    try {
      const res = await fetch('/api/history');
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        consoleEl.innerHTML = '';
        data.forEach(renderEntry);
      }
    } catch (e) {
      console.error('Không tải được lịch sử:', e);
    }
  }

  // Kết nối WebSocket, tự động reconnect nếu mất kết nối
  let ws;
  function connectWS() {
    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${protocol}://${location.host}/ws`);

    ws.onopen = () => {
      statusDot.classList.add('connected');
    };

    ws.onclose = () => {
      statusDot.classList.remove('connected');
      setTimeout(connectWS, 1500); // thử kết nối lại
    };

    ws.onerror = () => {
      ws.close();
    };

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'data') {
          renderEntry(msg.entry);
        } else if (msg.type === 'clear') {
          clearConsole();
        }
      } catch (e) {
        console.error('Lỗi xử lý message:', e);
      }
    };
  }

  loadHistory().then(connectWS);
</script>

</body>
</html>
